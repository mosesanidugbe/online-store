name: Online Store CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DB_USER: postgres
      DB_HOST: localhost
      DB_NAME: online_store_test
      DB_PASSWORD: postgres
      DB_PORT: 5432
      JWT_SECRET: test-only-secret

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: online_store_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: server
        run: npm ci
      - name: Set up test database
        working-directory: server
        run: PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -p $DB_PORT -U $DB_USER -d $DB_NAME -f db/schema.sql
      - name: Run tests
        working-directory: server
        run: npm test
      - name: Install dependencies for client
        working-directory: client
        run: npm ci
      - name: Run client lint tests
        working-directory: client
        run: npm run lint
      - name: Run client build tests
        working-directory: client
        run: npm run build
